# Domain config (synthetic). Reasoning core đọc file này; không hard-code KPI/nhóm giả thuyết trong code.

domain: manufacturing
plant:                      # bố trí nhà máy (hợp đồng dữ liệu 1.2); scenario và validator đọc từ đây
  machines: [M01, M02, M03]
  shifts: [morning, afternoon, night]
  shift_start_hours: {morning: 6, afternoon: 14, night: 22}
  timezone: Asia/Ho_Chi_Minh  # chỉ để hiển thị; dữ liệu không kèm múi giờ
machine_log:
  event_types: [setpoint_change, program_change, maintenance, calibration, breakdown, alarm, note]
validate:
  max_missing_shifts: 3     # số ca trống liên tiếp tối đa trên một máy trước khi cảnh báo
  min_monitor_days: 14      # ngày theo dõi tối thiểu sau kỳ tham chiếu
  operator_id_pattern: "^OP-[A-Z0-9]+$"
  pii_tokens: [name, fullname, email, phone, tel, mobile, address, birth, birthday, dob, cccd, cmnd]
kpis:
  - name: defect_rate
    unit: ratio
    target: 0.02
    alert_threshold_sd: 3   # theo control limits
    direction: decrease     # chiều tốt của KPI (do config quyết định, không do LLM)
    numerator: units_nonconforming  # cột production_log làm tử số
    denominator: units_produced
  - name: rework_rate
    unit: ratio
    target: 0.03
    alert_threshold_sd: 3
    direction: decrease
    numerator: units_reworked
    denominator: units_produced
detect:                     # tham số detect (mặc định = giá trị cũ trong code)
  reference_days: 28        # số ngày đầu dùng làm kỳ tham chiếu
  rule_window: 3            # luật k trên n: n điểm
  rule_hits: 2              # luật k trên n: k điểm vượt ngưỡng
  max_gap: 3                # khoảng gộp tối đa (điểm) giữa hai điểm xác nhận
investigate:
  max_tool_steps: 6         # số vòng gọi LLM tối đa khi điều tra
  max_log_rows: 50          # số dòng tối đa một tool đọc log trả về; nhiều hơn thì cắt và báo truncated
  max_format_retries: 1     # số lần yêu cầu LLM sửa câu trả lời không parse được, quá thì báo lỗi
improve:
  max_evidence_item_chars: 800  # cỡ tối đa (ký tự) mỗi mục evidence đưa vào prompt Improve
  max_format_retries: 1     # số lần yêu cầu LLM sửa đề xuất không parse được, quá thì báo lỗi
actions:
  # tên tham số máy mà đề xuất được phép đổi (action.parameter); tên lạ thì yêu cầu LLM sửa.
  # Simulator chỉ mô hình hoá zone3_setpoint_c; đổi tham số khác hợp lệ nhưng không làm KPI giảm.
  parameters: [zone3_setpoint_c, zone2_setpoint_c, other_parameter_c]
  limits:                   # miền giá trị hợp lệ (gồm biên) của từng tham số; ngoài miền/NaN/inf thì yêu cầu LLM sửa
    zone3_setpoint_c: {min: 150, max: 220}
    zone2_setpoint_c: {min: 150, max: 220}
    other_parameter_c: {min: 0, max: 500}
ask:
  confidence_threshold: 0.6 # độ tin cậy giả thuyết đứng đầu dưới ngưỡng này thì hỏi người
  max_questions: 2          # số lần hỏi tối đa mỗi run; vượt thì dừng chờ người
measure:
  window_days: 7            # cửa sổ before/after khi đo KPI sau khi áp dụng
  min_samples_after: 6      # ít hơn số điểm KPI này sau thay đổi -> "chưa đủ bằng chứng" (hỏi người, không rollback)
  tolerance: 0.25          # đạt khi KPI trong 25% so với target (đúng phía tốt); không đạt -> đề xuất rollback
loop:
  max_rejections: 3         # số đề xuất bị từ chối tối đa trước khi dừng chờ người
  max_rollbacks: 2          # số lần rollback tối đa giữa hai lần dừng (người chọn "điều tra lại" thì đếm lại)
  max_total_rollbacks: 4    # tổng rollback của cả run (không đặt lại); vượt thì chỉ còn lựa chọn kết thúc
  max_revisions: 3          # số lần người chọn revise tối đa; thêm một lần nữa thì dừng chờ người
  max_retries: 3            # số lần /retry liên tiếp thất bại tối đa mỗi run; vượt thì 409, retryable=false
approvers:                  # người được duyệt/từ chối (allow-list, tên synthetic)
  - alice                   # trưởng ca
  - bob                     # QA
  - qa_lead                 # trưởng QA
signals:                    # tên miền mà tool correlate và nhật ký máy dùng
  setpoint_event: setpoint_change     # event_type trong machine_log khi đổi setpoint
  setpoint_deviation: wrong_setpoint  # giả thuyết đo bằng độ lệch setpoint so với SOP
  batch_change: material_batch        # giả thuyết đo bằng đổi lô nguyên liệu
default_period: ["2026-10-01", "2026-10-07"]  # khoảng ngày của bản mock (không có tool thật)
demo:
  machine_id: M02           # máy mà kịch bản LLM giả (demo) điều tra
hypothesis_groups:          # Ishikawa
  machine: [wrong_setpoint, wear, calibration]
  method: [outdated_sop, missing_check]
  material: [material_batch]
  environment: [ambient_temperature]
  people: [new_operator, training_gap]
sop:                        # SOP mẫu synthetic, có phiên bản
  - id: SOP-RFL-001
    version: 1
    title: Reflow oven setpoint check (synthetic)
    steps:
      - Verify zone3_setpoint_c (180 C) against the setpoint table at shift start.
      - Record the zone3_setpoint_c value on the shift sheet.
      - Run a first-article inspection before releasing the lot.
  - id: SOP-CAL-002
    version: 1
    title: Machine calibration routine (synthetic)
    steps:
      - Calibrate sensors every 7 days.
      - Log the calibration result in the maintenance sheet.
