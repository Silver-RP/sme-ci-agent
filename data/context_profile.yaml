# Domain config (synthetic). Reasoning core đọc file này; không hard-code KPI/nhóm giả thuyết trong code.

domain: manufacturing
plant:                      # bố trí nhà máy (hợp đồng dữ liệu 1.2); scenario và validator đọc từ đây
  machines: [M01, M02, M03]
  shifts: [morning, afternoon, night]
  shift_start_hours: {morning: 6, afternoon: 14, night: 22}
  timezone: Asia/Ho_Chi_Minh  # chỉ để hiển thị; dữ liệu không kèm múi giờ
machine_log:
  event_types: [setpoint_change, program_change, maintenance, calibration, breakdown, alarm, note]
validate:
  max_missing_shifts: 3     # số ca trống liên tiếp tối đa trên một máy trước khi cảnh báo
  min_monitor_days: 14      # ngày theo dõi tối thiểu sau kỳ tham chiếu
  operator_id_pattern: "^OP-[A-Z0-9]+$"
  pii_tokens: [name, fullname, email, phone, tel, mobile, address, birth, birthday, dob, cccd, cmnd]
kpis:
  - name: defect_rate
    unit: ratio
    target: 0.02
    alert_threshold_sd: 3   # theo control limits
    direction: decrease     # chiều tốt của KPI (do config quyết định, không do LLM)
    numerator: units_nonconforming  # cột production_log làm tử số
    denominator: units_produced
  - name: rework_rate
    unit: ratio
    target: 0.03
    alert_threshold_sd: 3
    direction: decrease
    numerator: units_reworked
    denominator: units_produced
detect:                     # tham số detect (mặc định = giá trị cũ trong code)
  reference_days: 28        # số ngày đầu dùng làm kỳ tham chiếu
  rule_window: 3            # luật k trên n: n điểm
  rule_hits: 2              # luật k trên n: k điểm vượt ngưỡng
  max_gap: 3                # khoảng gộp tối đa (điểm) giữa hai điểm xác nhận
  max_detect_delay_shifts: 3  # phát hiện theo dòng thời gian: muộn nhất bao nhiêu ca sau start
investigate:
  max_tool_steps: 6         # số vòng gọi LLM tối đa khi điều tra
  max_log_rows: 50          # số dòng tối đa một tool đọc log trả về; nhiều hơn thì cắt và báo truncated
  max_format_retries: 1     # số lần yêu cầu LLM sửa câu trả lời không parse được, quá thì báo lỗi
  max_lessons: 5            # số bài học cũ (cùng KPI) đưa vào prompt Investigate làm ngữ cảnh; 0 = tắt
learn:
  min_cause_evidence: 0.5   # |r| tối thiểu của chính tín hiệu giả thuyết đứng đầu (kết quả tool) để bài học ghi cause_status=confirmed
  cause_parameters:         # bảng nối giả thuyết -> tham số action tác động lên nó; action ngoài bảng thì không xác nhận nguyên nhân
    wrong_setpoint: [zone3_setpoint_c]
  unconfirmed_label: "chưa xác nhận nguyên nhân"  # nhãn trước bài học cause_status=unconfirmed trong prompt Investigate
improve:
  max_evidence_item_chars: 800  # cỡ tối đa (ký tự) mỗi mục evidence đưa vào prompt Improve
  max_format_retries: 1     # số lần yêu cầu LLM sửa đề xuất không parse được, quá thì báo lỗi
actions:
  # tên tham số máy mà đề xuất được phép đổi (action.parameter); tên lạ thì yêu cầu LLM sửa.
  # Simulator chỉ mô hình hoá zone3_setpoint_c; đổi tham số khác hợp lệ nhưng không làm KPI giảm.
  parameters: [zone3_setpoint_c, zone2_setpoint_c, other_parameter_c]
  limits:                   # miền giá trị hợp lệ (gồm biên) của từng tham số; ngoài miền/NaN/inf thì yêu cầu LLM sửa
    zone3_setpoint_c: {min: 150, max: 220}
    zone2_setpoint_c: {min: 150, max: 220}
    other_parameter_c: {min: 0, max: 500}
ask:
  confidence_threshold: 0.6 # độ tin cậy giả thuyết đứng đầu dưới ngưỡng này thì hỏi người
  max_questions: 2          # số lần hỏi tối đa mỗi run; vượt thì dừng chờ người
measure:
  window_days: 7            # cửa sổ before/after khi đo KPI sau khi áp dụng
  min_samples_after: 6      # chỉ khi không có production_log (đo từ kpi_log): ít điểm hơn thế -> "chưa đủ bằng chứng"
  min_units_after: 6000     # ít đơn vị (tổng mẫu số KPI) hơn thế sau thay đổi -> "chưa đủ bằng chứng" (hỏi người, không rollback); ~6 ca
  source_may_grow: false    # sandbox: dữ liệu sau thay đổi cố định theo run_id; chờ thêm không có điểm mới -> báo một lần, chỉ cho kết thúc. Nguồn thật có thể tăng: true (giữ hành vi hỏi rồi đo lại)
  tolerance: 0.25          # đạt khi KPI trong 25% so với target (đúng phía tốt); không đạt -> đề xuất rollback
loop:
  max_rejections: 3         # số đề xuất bị từ chối tối đa trước khi dừng chờ người
  max_rollbacks: 2          # số lần rollback tối đa giữa hai lần dừng (người chọn "điều tra lại" thì đếm lại)
  max_total_rollbacks: 4    # tổng rollback của cả run (không đặt lại); vượt thì chỉ còn lựa chọn kết thúc
  max_revisions: 3          # số lần người chọn revise tối đa; thêm một lần nữa thì dừng chờ người
  max_retries: 3            # số lần /retry liên tiếp thất bại tối đa mỗi run; vượt thì 409, retryable=false
assumptions:                # tham số dữ liệu không sinh ra; metrics_report in danh sách này và chạy độ nhạy với `alternatives`
  # source để trống = "giả định, chờ D3" (docs/research/reflow_domain.md của vai A)
  manual_detect_delay_hours: {value: 72, unit: hours, source: "", alternatives: [24, 168]}  # không agent: từ start tới lúc người phát hiện
  manual_fix_delay_hours: {value: 24, unit: hours, source: "", alternatives: [8, 72]}       # không agent: từ lúc phát hiện tới lúc sửa có hiệu lực
  approval_delay_hours: {value: 4, unit: hours, source: "", alternatives: [1, 24]}          # có agent: từ lúc agent đề xuất tới lúc người duyệt, thay đổi có hiệu lực
  sop_prevention_efficacy: {value: 0.5, unit: ratio, source: "", alternatives: [0.25, 0.75]}  # có agent: phần tái diễn được SOP mới chặn lại
approvers:                  # người được duyệt/từ chối (allow-list, tên synthetic)
  - alice                   # trưởng ca
  - bob                     # QA
  - qa_lead                 # trưởng QA
signals:                    # tên miền mà tool correlate và nhật ký máy dùng
  setpoint_event: setpoint_change     # event_type trong machine_log khi đổi setpoint
  setpoint_deviation: wrong_setpoint  # giả thuyết đo bằng độ lệch setpoint so với SOP
  batch_change: material_batch        # giả thuyết đo bằng đổi lô nguyên liệu
default_period: ["2026-10-01", "2026-10-07"]  # khoảng ngày của bản mock (không có tool thật)
demo:
  machine_id: M02           # máy mà kịch bản LLM giả (demo) điều tra
  texts:                    # câu hiển thị của LLM giả (tiếng Việt)
    unclear_cause: "Chưa rõ nguyên nhân"
    change: "Khôi phục setpoint và thêm bước kiểm tra setpoint vào SOP"
    rationale: "Bằng chứng 0 cho thấy tỷ lệ lỗi thay đổi theo setpoint"
ui:
  language: vi              # ngôn ngữ LLM dùng cho các trường hiển thị (mã ISO)
messages:                   # câu hiện cho người dùng (template {placeholder}); mã, khoá, tên trường giữ tiếng Anh
  question_no_hypothesis: "Chưa đủ bằng chứng để đưa ra giả thuyết. Anh/chị biết thêm điều gì về bất thường này?"
  question_unsupported_hypothesis: "Giả thuyết đứng đầu ({group}: {description}) có độ tin cậy {confidence:.2f} nhưng chưa có kết quả công cụ nào hỗ trợ. Anh/chị xác nhận giúp hoặc cho biết bằng chứng đang có?"
  question_low_confidence: "Giả thuyết đứng đầu ({group}: {description}) có độ tin cậy {confidence:.2f}, thấp hơn ngưỡng {threshold:.2f}. Anh/chị xác nhận hoặc bổ sung thông tin?"
  halt_question_finish: "Agent đã dừng ({reason}). Kết thúc phiên chạy?"
  halt_question_investigate: "Agent đã dừng ({reason}). Điều tra lại (bổ sung thông tin nếu có) hay kết thúc?"
  halt_reasons:             # nhãn tiếng Việt của mã lý do dừng (mã giữ nguyên trong payload.reason)
    insufficient_evidence: "chưa đủ bằng chứng sau thay đổi"
    rollback_declined: "đề xuất hoàn tác bị từ chối"
    max_total_rollbacks_reached: "đã hết số lần hoàn tác của cả phiên chạy"
    max_rollbacks_reached: "đã đạt số lần hoàn tác tối đa"
    max_revisions_reached: "đã đạt số lần yêu cầu sửa đề xuất tối đa"
    max_rejections_reached: "đã đạt số lần từ chối đề xuất tối đa"
    max_questions_reached: "đã đạt số câu hỏi tối đa"
  evidence_wait_question: "Chưa đủ bằng chứng: sau thay đổi mới có {n_after} {n_unit} cho {kpi} (cần {needed}). Chờ thêm dữ liệu rồi xác nhận để đo lại."
  evidence_final_question: "Chưa đủ bằng chứng: sau thay đổi chỉ có {n_after} {n_unit} cho {kpi} (cần {needed}) và nguồn dữ liệu không còn thêm điểm nào, nên chờ cũng không đo lại được. Kết thúc phiên chạy."
  rollback_change_sop: "Hoàn tác SOP {sop_id} về phiên bản {previous_version}"
  rollback_change_no_sop: "Hoàn tác thay đổi (không có phiên bản SOP để khôi phục)"
  rollback_rationale: "{kpi} sau thay đổi là {after}, ngoài giới hạn (mục tiêu {target}, dung sai {tolerance})."
  not_applied_no_sop: "Đề xuất không đổi SOP nào nên không có gì để đo."
  not_applied_no_action: "Đề xuất không có hành động có cấu trúc nên chưa đổi tham số máy nào."
  sop_conflict: "SOP {sop_id} xung đột: đề xuất dựa trên phiên bản {base_version} nhưng hiện đang áp dụng phiên bản {current_version}; chưa thay đổi gì."
hypothesis_groups:          # Ishikawa
  machine: [wrong_setpoint, wear, calibration]
  method: [outdated_sop, missing_check]
  material: [material_batch]
  environment: [ambient_temperature]
  people: [new_operator, training_gap]
sop:                        # SOP mẫu synthetic, có phiên bản
  - id: SOP-RFL-001
    version: 1
    title: Reflow oven setpoint check (synthetic)
    steps:
      - Verify zone3_setpoint_c (180 C) against the setpoint table at shift start.
      - Record the zone3_setpoint_c value on the shift sheet.
      - Run a first-article inspection before releasing the lot.
  - id: SOP-CAL-002
    version: 1
    title: Machine calibration routine (synthetic)
    steps:
      - Calibrate sensors every 7 days.
      - Log the calibration result in the maintenance sheet.
