services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sme}
      POSTGRES_DB: ${POSTGRES_DB:-sme_ci}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
