# Kiểm docs/goals/<slug>/goal.json do /autodev-goal viết (P10, thiết kế 6.16).
# P11/P12 đọc goal.json, nên file sai khuôn phải đỏ ở PR. Script và workflow do plugin-guard bảo vệ.
name: goal-check

on:
  pull_request:
    paths:
      - "docs/goals/**"
      - ".autodev/goal_check.py"
      - ".autodev/tests/test_goal_check.py"
      - ".github/workflows/goal-check.yml"

permissions:
  contents: read

jobs:
  goal-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Test goal_check
        run: python3 -m unittest discover -s .autodev/tests -p 'test_goal_check.py' -v
      - name: Check goal.json
        run: |
          files=$(find docs/goals -name goal.json 2>/dev/null | sort)
          if [ -z "$files" ]; then
            echo "Chưa có goal.json."
            exit 0
          fi
          python3 .autodev/goal_check.py $files
