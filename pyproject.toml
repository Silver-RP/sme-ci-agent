[project]
name = "sme-cl-agent"
version = "0.1.0"
description = "SME CI Agent - Vietnam Japan AI Hackathon 2026"
authors = [
    { name = "silver-oss", email = "thachlhps37716@fpt.edu.vn" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.3",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
